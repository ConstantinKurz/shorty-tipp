[project]
name = "django-tipapp"
version = "0.1.0"
description = "World Cup 2026 tipping game built with Django"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.7",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.8",
    "django-stubs>=5.0",
]
pdf = [
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tipapp", "users", "matches", "predictions", "scoring"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tipapp.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
testpaths = ["."]
markers = [
    "django_db: mark test to use database",
]
django_find_project = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-include = ["*.pyi"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "UP",      # pyupgrade
    "DJ",      # flake8-django
    "PLC0415", # import not at top of file
    "BLE001",  # blind except Exception
    "TID",     # flake8-tidy-imports
    "RUF",     # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF012", # Django declares Meta options, choices and admin lists as plain class lists
    "RUF001", # German UI strings and rule texts use typographic characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Django requires signal imports inside AppConfig.ready().
"scoring/apps.py" = ["PLC0415"]
"users/apps.py" = ["PLC0415"]
# Standalone diagnostic script: prints results and must survive any failure.
"scripts/verify_scoring.py" = ["BLE001", "T201", "RUF059"]
# Django's generated entry point imports inside main() to produce a readable error.
"manage.py" = ["PLC0415"]
# Generated migrations and test modules may import inside functions, and test
# fixtures commonly unpack more values than a single test needs.
"**/migrations/*.py" = ["PLC0415"]
"**/tests/*.py" = ["PLC0415", "RUF059"]
"conftest.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["tipapp", "users", "matches", "predictions", "scoring"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Generated migrations, the Django entry point and the standalone verification
# script are not part of the typed application surface.
module = ["*.migrations.*", "manage", "verify_scoring"]
ignore_errors = true

[[tool.mypy.overrides]]
# Test modules and fixtures are written without annotations on purpose; pytest
# and pytest-django provide no usable stubs for fixture functions, for the
# monkey-patched test client responses or for Django field introspection, and
# assertions on impossible states are deliberate.
module = ["*.tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false
warn_unreachable = false
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# BaseCommand.handle/add_arguments are untyped in django-stubs, so annotating
# the overrides here would not make the call sites type-safe.
module = "*.management.commands.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# django-stubs requires explicit generic parameters on Field, ModelForm and
# ModelAdmin; the project uses the plain Django API instead.
module = ["*.models", "*.forms", "*.admin", "*.views"]
disallow_any_generics = false

[[tool.mypy.overrides]]
# reportlab publishes no type stubs.
module = "reportlab.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tipapp.settings.development"

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
