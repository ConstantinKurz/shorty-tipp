<!DOCTYPE html>
<html lang="de" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shortytipp Tippspiel{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Custom accent colors
                        accent: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <!-- Dark mode initialization (runs before render to prevent flash) -->
    <script>
            (function () {
                const stored = localStorage.getItem('darkMode');
                if (stored === 'false') {
                    document.documentElement.classList.remove('dark');
                } else if (stored === 'true') {
                    document.documentElement.classList.add('dark');
                } else {
                    // Check system preference
                    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                }
            })();
    </script>

    {% block extra_head %}{% endblock %}
</head>

<body class="bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 min-h-screen transition-colors duration-200">
    <!-- Navigation header (shown when logged in) -->
    {% if user.is_authenticated %}
    <header class="bg-white dark:bg-zinc-800 border-b border-zinc-200 dark:border-zinc-700 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="{% url 'home' %}"
                class="text-lg font-bold text-zinc-900 dark:text-white hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors duration-200">
                Shortytipp
            </a>
            <nav class="flex items-center gap-4 text-sm">
                <a href="{% url 'predictions:prediction-list' %}"
                    class="text-zinc-600 dark:text-zinc-300 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors duration-200 {% if request.resolver_match.url_name == 'prediction-list' %}text-emerald-600 dark:text-emerald-400 font-medium{% endif %}">
                    Tipps
                </a>
                <a href="{% url 'users:rules' %}"
                    class="text-zinc-600 dark:text-zinc-300 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors duration-200 {% if request.resolver_match.url_name == 'rules' %}text-emerald-600 dark:text-emerald-400 font-medium{% endif %}">
                    Rules
                </a>
                {% if user.is_staff %}
                <a href="/admin/"
                    class="text-zinc-600 dark:text-zinc-300 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors duration-200"
                    title="Django Admin">
                    Admin
                </a>
                {% endif %}
                <span class="text-zinc-300 dark:text-zinc-600">|</span>
                <a href="{% url 'users:settings' %}"
                    class="flex items-center gap-1 text-zinc-500 dark:text-zinc-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors duration-200 {% if request.resolver_match.url_name == 'settings' %}text-emerald-600 dark:text-emerald-400{% endif %}"
                    title="Einstellungen">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span>{{ user.username }}</span>
                </a>
                <form method="post" action="{% url 'logout' %}" class="inline">
                    {% csrf_token %}
                    <button type="submit"
                        class="text-zinc-500 dark:text-zinc-400 hover:text-red-600 dark:hover:text-red-400 transition-colors duration-200">
                        Logout
                    </button>
                </form>
            </nav>
        </div>
    </header>
    {% endif %}

    {% block content %}{% endblock %}

    <!-- Dark mode toggle script -->
    <script>
        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');

            if (isDark) {
                html.classList.remove('dark');
                localStorage.setItem('darkMode', 'false');
            } else {
                html.classList.add('dark');
                localStorage.setItem('darkMode', 'true');
            }

            // Update toggle button icon
            updateToggleIcon();
        }

        function updateToggleIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const sunIcon = document.getElementById('sun-icon');
            const moonIcon = document.getElementById('moon-icon');

            if (sunIcon && moonIcon) {
                if (isDark) {
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                } else {
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                }
            }
        }

        // Update icon on page load
        document.addEventListener('DOMContentLoaded', updateToggleIcon);
    </script>

    <!-- Auto-save: Submit prediction form when both home + away goals filled -->
    <!-- Debounced to avoid spamming server while user types -->
    <script>
        document.addEventListener('input', function (e) {
            if (!e.target.classList.contains('prediction-input')) return;

            const form = e.target.closest('.prediction-form');
            if (!form) return;

            const homeInput = form.querySelector('[name="predicted_goals_home"]');
            const awayInput = form.querySelector('[name="predicted_goals_away"]');

            // Clear previous timer (debounce)
            if (form.debounceTimer) clearTimeout(form.debounceTimer);

            // Wait 500ms after last keystroke, then submit if both fields filled
            form.debounceTimer = setTimeout(function () {
                if (homeInput.value !== '' && awayInput.value !== '') {
                    htmx.trigger(form, 'submit');  // Trigger HTMX form submission
                }
            }, 500);
        });
    </script>

    <!-- HTMX Error Handler - gracefully handle swap errors when target doesn't exist -->
    <script>
        document.body.addEventListener('htmx:swapError', function(evt) {
            // Suppress errors when target element doesn't exist (e.g., user navigated away)
            console.debug('HTMX swap error (suppressed):', evt.detail.error);
            evt.preventDefault();
        });
        
        document.body.addEventListener('htmx:targetError', function(evt) {
            // Suppress errors when target element doesn't exist
            console.debug('HTMX target error (suppressed):', evt.detail.error);
            evt.preventDefault();
        });
        
        // Abort pending requests when navigating away
        document.body.addEventListener('htmx:beforeSwap', function(evt) {
            // If target doesn't exist, abort the swap silently
            if (!evt.detail.target) {
                evt.detail.shouldSwap = false;
            }
        });
    </script>
</body>

</html>
