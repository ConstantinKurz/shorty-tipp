services:
  db:
    image: postgres:16-alpine
    container_name: tipapp-db
    environment:
      POSTGRES_DB: tipapp
      POSTGRES_USER: tipapp
      POSTGRES_PASSWORD: tipapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tipapp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
